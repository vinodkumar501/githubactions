name: mynewjob
on: push 
jobs:
 test:
  runs-on: ubuntu-latest
  steps:
    - name: download code from repo 
      uses: actions/checkout@v7
    - name: install nodejs
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: install dependencies
      run: npm ci   //npm install  
    - name: run tests
      run: npm test
 deploy:
  runs-on: ubuntu-latest
  steps:
    - name: download code from repo 
      uses: actions/checkout@v7
    - name: install nodejs
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: install dependencies
      run: npm ci   //npm install 
    - name: npm build 
      run: npm run build 
    - name: deploy 
      run: echo "deployed"   
  